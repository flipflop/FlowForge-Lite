name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - name: Lint the SAM template (no AWS credentials needed)
        run: pip install cfn-lint && cfn-lint ../deploy/template.yaml

  web:
    # No npm: the frontend is static ES modules. Node is used only as a test runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Unit tests (store, geometry, component logic)
        run: node --test web/tests/*.test.mjs
      - name: Browser selftests (canvas engine + real app, headless Chrome)
        run: |
          python3 -m http.server 8080 -d web >/dev/null 2>&1 &
          sleep 1
          for page in dev/canvas-harness.html?selftest=1 dev/app-selftest.html; do
            title=$(google-chrome --headless=new --no-sandbox --virtual-time-budget=12000 --dump-dom "http://localhost:8080/$page" | grep -o '<title>[^<]*')
            echo "$page -> $title"
            echo "$title" | grep -q 'PASS' || exit 1
          done
